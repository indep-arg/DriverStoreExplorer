name: WinUI

# Builds the experimental WinUI 3 front end. It is separate from CI so the WinForms build and its
# releases are not affected. Runs when the WinUI project or the code it shares with the WinForms app
# changes.
on:
  push:
    paths:
      - 'RaprWinUI/**'
      - 'Rapr/Utils/**'
      - 'Rapr/Lang/**'
      - 'Rapr/DriverStoreType.cs'
      - 'Rapr/icon.ico'
      - '.github/workflows/winui.yml'
  pull_request:
    branches: [master]
    paths:
      - 'RaprWinUI/**'
      - 'Rapr/Utils/**'
      - 'Rapr/Lang/**'
      - 'Rapr/DriverStoreType.cs'
      - 'Rapr/icon.ico'
      - '.github/workflows/winui.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
          - platform: ARM64
            rid: win-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # A folder with DriverStoreExplorer.exe. It carries the Windows App SDK; it needs the
      # .NET 10 Runtime installed.
      - name: Publish
        run: dotnet publish RaprWinUI\RaprWinUI.csproj -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }} --self-contained false -o publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: DriverStoreExplorer-WinUI-${{ matrix.platform }}-unsigned
          path: publish/
